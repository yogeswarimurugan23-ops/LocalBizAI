{% extends "base.html" %}
{% block title %}{{ code }} · LocalBiz AI{% endblock %}
{% block breadcrumb %}Something went wrong{% endblock %}
{% block content %}
<section class="panel empty-state">
  <p class="eyebrow">Request {{ code }}</p>
  <h1>We couldn't complete that request.</h1>
  <p>{{ message }}</p>
  <a class="button" href="{{ url_for('dashboard') }}">Back to overview</a>
</section>
{% endblock %}
